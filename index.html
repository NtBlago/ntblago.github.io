<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vlad — Social Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">
    <!-- Avatar -->
    <div class="avatar-wrapper">
      <div class="avatar">
        <span class="avatar-initials">VL</span>
      </div>
      <div class="status-dot"></div>
    </div>

    <!-- Header -->
    <header class="header">
      <h1 class="name">Vlad</h1>
      <p class="tagline">
        Hi, my name is Blago — just kidding!<br />
        My name is actually <strong>Vlad</strong>, and here's how you can get in touch with me.
      </p>
    </header>

    <!-- Social Cards -->
    <main class="cards">

      <!-- VKontakte -->
      <a
        href="https://vk.com/blagorounin"
        target="_blank"
        rel="noopener noreferrer"
        class="card card--vk"
        aria-label="VKontakte profile"
      >
        <div class="card__icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M15.684 0H8.316C1.592 0 0 1.592 0 8.316v7.368C0 22.408 1.592 24 8.316 24h7.368C22.408 24 24 22.408 24 15.684V8.316C24 1.592 22.408 0 15.684 0zm3.692 17.123h-1.744c-.66 0-.862-.523-2.049-1.712-1.033-1-1.49-.872-1.49.287v1.425c0 .376-.12.6-1.112.6-1.638 0-3.455-1-4.733-2.865-1.92-2.705-2.447-4.733-2.447-5.146 0-.198.1-.382.4-.382h1.743c.297 0 .41.14.524.467.576 1.66 1.543 3.117 1.94 3.117.149 0 .216-.068.216-.444V9.458c-.05-.795-.464-.862-.464-1.144 0-.139.115-.279.3-.279h2.742c.247 0 .335.131.335.417v2.251c0 .247.11.335.179.335.149 0 .275-.088.55-.363 1.703-1.901 2.917-4.84 2.917-4.84a.45.45 0 0 1 .419-.286h1.743c.525 0 .64.269.525.568-.22.513-2.353 4.03-2.353 4.03-.186.307-.254.443 0 .79.186.261.793.804 1.2 1.288.742.857 1.308 1.578 1.46 2.075.133.487-.124.734-.611.734z"/>
          </svg>
        </div>
        <div class="card__info">
          <span class="card__platform">VKontakte</span>
          <span class="card__handle">@blago rounin</span>
        </div>
        <div class="card__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </a>

      <!-- Instagram -->
      <a
        href="https://instagram.com/ntblago"
        target="_blank"
        rel="noopener noreferrer"
        class="card card--instagram"
        aria-label="Instagram profile"
      >
        <div class="card__icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
          </svg>
        </div>
        <div class="card__info">
          <span class="card__platform">Instagram</span>
          <span class="card__handle">@NtBlago</span>
        </div>
        <div class="card__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </a>

      <!-- Telegram -->
      <a
        href="https://t.me/ntblago"
        target="_blank"
        rel="noopener noreferrer"
        class="card card--telegram"
        aria-label="Telegram profile"
      >
        <div class="card__icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
        </div>
        <div class="card__info">
          <span class="card__platform">Telegram</span>
          <span class="card__handle">@ntblago</span>
        </div>
        <div class="card__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </a>

      <!-- TikTok -->
      <a
        href="https://tiktok.com/@ntblago"
        target="_blank"
        rel="noopener noreferrer"
        class="card card--tiktok"
        aria-label="TikTok profile"
      >
        <div class="card__icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.77a4.85 4.85 0 0 1-1.01-.08z"/>
          </svg>
        </div>
        <div class="card__info">
          <span class="card__platform">TikTok</span>
          <span class="card__handle">@ntblago</span>
        </div>
        <div class="card__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </a>

    </main>

    <footer class="footer">
      <p>Made with <span aria-label="love">♥</span> by Vlad</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
